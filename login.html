<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | LUXEBOOTH</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23d4af37%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z%22/><circle cx=%2212%22 cy=%2213%22 r=%223%22/></svg>">

  <!-- CSS Library CDNs -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Core Styles -->
  <link href="css/style.css" rel="stylesheet">
  <link href="css/auth.css" rel="stylesheet">
</head>

<body class="auth-page">

  <div class="auth-card">
    <a href="index.html" class="brand-logo justify-content-center mb-4">
      <div class="brand-logo-icon-wrapper">
        <i data-lucide="aperture"></i>
      </div>
      LUXE<span>BOOTH</span>
    </a>
    
    <div class="text-center mb-4">
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to access your dashboard and event galleries.</p>
    </div>
    
    <form action="#" method="POST">
      <div class="auth-form-group">
        <label class="auth-label">Email Address</label>
        <input type="email" class="form-control auth-input" placeholder="john@example.com" required>
      </div>
      
      <div class="auth-form-group">
        <label class="auth-label">Password</label>
        <input type="password" class="form-control auth-input" placeholder="********" required>
      </div>
      
      <div class="d-flex justify-content-between align-items-center mb-4 flex-nowrap gap-2">
        <div class="form-check mb-0 text-nowrap">
          <input type="checkbox" class="form-check-input" id="rememberMe">
          <label class="form-check-label auth-label-sm" for="rememberMe">Remember me</label>
        </div>
        <a href="#" class="auth-link text-nowrap text-end">Forgot password?</a>
      </div>
      
      <button type="submit" class="btn-gold-primary auth-btn mb-4">Sign In</button>
    </form>
    
    <div class="auth-divider">
      <span>or continue with</span>
    </div>
    
    <div class="d-flex gap-3 mb-4">
      <button type="button" class="auth-social-btn flex-grow-1">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/google.svg" alt="Google" class="social-icon-img"> Google
      </button>
      <button type="button" class="auth-social-btn flex-grow-1">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/apple.svg" alt="Apple" class="social-icon-img"> Apple
      </button>
    </div>
    
    <div class="text-center auth-footer-text">
      Don't have an account? <a href="register.html" class="auth-link">Sign up now</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.372.0/dist/umd/lucide.min.js"></script>
  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  </script>
</body>
</html>
