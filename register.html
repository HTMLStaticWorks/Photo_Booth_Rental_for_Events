<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | LUXEBOOTH</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23d4af37%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z%22/><circle cx=%2212%22 cy=%2213%22 r=%223%22/></svg>">

  <!-- CSS Library CDNs -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Core Styles -->
  <link href="css/style.css" rel="stylesheet">
  <link href="css/auth.css" rel="stylesheet">
</head>

<body class="auth-page">
<header class="premium-header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-logo-icon-wrapper">
          <i data-lucide="aperture"></i>
        </div>
        LUXE<span>BOOTH</span>
      </a>

      <!-- Navigation Order: Home, Home 2, About, Services, Booth Styles, Packages, Gallery, Testimonials, Contact -->
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link active">Home</a></li>
          <li><a href="home2.html" class="nav-link">Home 2</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="services.html" class="nav-link">Services</a></li>
          <li><a href="booth-styles.html" class="nav-link">Booth Styles</a></li>
          <li><a href="pricing.html" class="nav-link">Packages</a></li>
          <li><a href="gallery.html" class="nav-link">Gallery</a></li>
          <li><a href="faq.html" class="nav-link">Testimonials</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
          <!-- Mobile & Tablet menu controls -->
          <li class="mobile-menu-controls">
            <button class="icon-btn theme-toggle" aria-label="Toggle Dark/Light Mode">
              <i data-lucide="moon"></i>
            </button>
            <button class="icon-btn rtl-toggle" aria-label="Toggle RTL Alignment">
              <i data-lucide="arrow-left-right"></i>
            </button>
            <a href="login.html" class="btn-glass-secondary">Login</a>
            <a href="contact.html" class="btn-gold-primary">Book Now</a>
          </li>
        </ul>
      </nav>

      <!-- Header controls for Desktop -->
      <div class="header-controls">
        <button class="icon-btn theme-toggle" aria-label="Toggle Dark/Light Mode">
          <i data-lucide="moon"></i>
        </button>
        <button class="icon-btn rtl-toggle" aria-label="Toggle RTL Alignment">
          <i data-lucide="arrow-left-right"></i>
        </button>
        <div class="header-ctas">
          <a href="login.html" class="btn-glass-secondary">Login</a>
          <a href="contact.html" class="btn-gold-primary">Book Now</a>
        </div>
        <button id="hamburger" class="hamburger-menu" aria-label="Open Mobile Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>
  <div class="auth-card">
    <a href="index.html" class="brand-logo justify-content-center mb-4">
      <div class="brand-logo-icon-wrapper">
        <i data-lucide="aperture"></i>
      </div>
      LUXE<span>BOOTH</span>
    </a>
    
    <div class="text-center mb-4">
      <h2 class="auth-title">Begin Your Legacy</h2>
      <p class="auth-subtitle">Register your profile to activate your event dashboard.</p>
    </div>
    
    <form action="#" method="POST">
      <div class="auth-form-group">
        <label class="auth-label">Full Name</label>
        <input type="text" class="form-control auth-input" placeholder="Jane Doe" required>
      </div>

      <div class="auth-form-group">
        <label class="auth-label">Email Address</label>
        <input type="email" class="form-control auth-input" placeholder="jane@example.com" required>
      </div>
      
      <div class="auth-form-group">
        <label class="auth-label">Password</label>
        <input type="password" class="form-control auth-input" placeholder="Min. 8 characters" required>
      </div>

      <div class="auth-form-group">
        <label class="auth-label">Confirm Password</label>
        <input type="password" class="form-control auth-input" placeholder="Re-enter password" required>
      </div>
      
      <div class="form-check mb-4 d-flex gap-2 align-items-start">
        <input type="checkbox" class="form-check-input mt-1" id="termsCheck" required>
        <label class="form-check-label auth-label-sm m-0" for="termsCheck">
          I agree to the LUXEBOOTH <a href="#" class="auth-link">Terms of Service</a> and consent to dynamic event matching.
        </label>
      </div>
      
      <button type="submit" class="btn-gold-primary auth-btn mb-4">Create Account</button>
    </form>
    
    <div class="auth-divider">
      <span>or continue with</span>
    </div>
    
    <div class="d-flex gap-3 mb-4">
      <button type="button" class="auth-social-btn flex-grow-1">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/google.svg" alt="Google" class="social-icon-img"> Google
      </button>
      <button type="button" class="auth-social-btn flex-grow-1">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/apple.svg" alt="Apple" class="social-icon-img"> Apple
      </button>
    </div>
    
    <div class="text-center auth-footer-text">
      Already have an account? <a href="login.html" class="auth-link">Sign in here</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.372.0/dist/umd/lucide.min.js"></script>
  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  </script>
</body>
</html>
